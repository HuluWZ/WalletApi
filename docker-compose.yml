services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: wallet }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 10 }
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Default: Host=db;Database=wallet;Username=postgres;Password=postgres
      Jwt__Key: change-me-change-me-change-me-32chars
      Scheduler__TickSeconds: "2"
      Seed__RegulatorEmail: regulator@wallet.local
      Seed__RegulatorPassword: Regulator#12345
    depends_on: { db: { condition: service_healthy } }
